<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" width="540" height="110">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  
  <!-- Left Emblem / Shield -->
  <rect x="8" y="10" width="90" height="90" rx="18" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Particle Dispersion & Hydro Orbit Inside Shield -->
  <circle cx="53" cy="55" r="30" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
  <circle cx="53" cy="55" r="22" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
  
  <!-- Particle Spheres -->
  <circle cx="42" cy="46" r="3" fill="#38bdf8" />
  <circle cx="64" cy="48" r="2" fill="#10b981" />
  <circle cx="53" cy="66" r="2.5" fill="#f59e0b" />
  <path d="M 33 55 Q 43 42 53 55 T 73 55" fill="none" stroke="url(#flowGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Lettermark PSTS -->
  <text x="53" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#38bdf8" letter-spacing="2">PSTS</text>
  
  <!-- Main Wordmark -->
  <text x="114" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0f172a" letter-spacing="0.5">PARTICLE SCIENCE</text>
  <rect x="420" y="24" width="95" height="22" rx="4" fill="#0284c7" />
  <text x="467" y="39" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="10" fill="#ffffff" letter-spacing="1">ISO 4406</text>
  
  <!-- Subtitles -->
  <text x="116" y="68" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#0284c7" letter-spacing="1">TRACKING &amp; CALIBRATION SYSTEM</text>
  <text x="116" y="88" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10.5" fill="#64748b" letter-spacing="0.8">CLEANLINESS ANALYSIS · 5-POINT FLOW &amp; PRESSURE CALIBRATION</text>
